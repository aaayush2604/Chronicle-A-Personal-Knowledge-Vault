version: 2

project_name: chronicle

builds:
  - main: ./cmd/ledger
    binary: chronicle
    goos:
      - windows
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_
      {{ .Os }}_
      {{ .Arch }}

    format_overrides:
      - goos: windows
        formats: [zip]

checksum:
  name_template: checksums.txt